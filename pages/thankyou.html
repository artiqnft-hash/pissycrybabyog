<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Submitted – DMCA</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fff;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        max-width: 480px;
        width: 100%;
        text-align: center;
        padding: 2.5rem 2rem;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        color: #374151;
        line-height: 1.7;
        margin-bottom: 1rem;
      }
      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background-color: #0482B3;
        color: #fff;
        font-weight: 700;
        padding: 0.7rem 1.5rem;
        border-radius: 9999px;
        text-decoration: none;
        font-size: 0.9rem;
        transition: background-color 0.2s;
        margin-top: 0.5rem;
      }
      .btn-back:hover { background-color: #03729e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✅</div>
      <h1>Report Submitted</h1>

        Thank you for your DMCA complaint. Your report has been delivered to our copyright team at

      <p>

        Please check your email for confirmation.
      </p>
      <div style="display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap; margin-top:1.25rem;">
        <a href="../index.html" class="btn-back" style="margin-top:0;">Home</a>
        <a href="dmca.html" class="btn-back" style="margin-top:0; background-color:#f3f4f6; color:#374151;">DMCA Page</a>
        <a href="privacy.html" class="btn-back" style="margin-top:0; background-color:#f3f4f6; color:#374151;">Privacy &amp; Terms</a>

    </div>

</html>
